[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-searxng"
version = "0.1.0"
description = "SearXNG MCP server — web search and URL reading"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "html2text>=2024.2",
]

[project.scripts]
mcp-searxng = "mcp_searxng.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_searxng"]
