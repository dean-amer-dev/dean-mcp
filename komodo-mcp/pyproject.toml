[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komodo-mcp"
version = "0.1.0"
description = "Komodo MCP server — stack status, syncs, deploy and delete stacks"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
komodo-mcp = "komodo_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/komodo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
