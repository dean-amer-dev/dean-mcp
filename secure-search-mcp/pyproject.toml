[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-search-mcp"
version = "0.1.0"
description = "NordVPN-enforced SearXNG MCP — hard VPN check before every request"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "html2text>=2024.2",
]

[project.scripts]
secure-search-mcp = "secure_search_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_search_mcp"]
