[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bridge"
version = "0.1.0"
description = "OpenAPI bridge for LiteLLM MCP gateway — translates MCP tools into OpenAPI endpoints"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bridge"]
