name: Build model-switch-mcp

on:
  push:
    branches: [main]
    paths:
      - 'model-switch-mcp/**'
      - '.github/workflows/build-model-switch-mcp.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'model-switch-mcp/**'
      - '.github/workflows/build-model-switch-mcp.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dean-amer-dev/model-switch-mcp

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --no-cache-dir ./model-switch-mcp pytest
      - name: Unit tests
        run: pytest model-switch-mcp/tests -v

  build:
    needs: test
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx (in-pod BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: unix:///run/buildkit/buildkitd.sock
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./model-switch-mcp
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
      - name: Record digest
        if: github.event_name != 'pull_request'
        run: echo "${IMAGE}:sha-${GITHUB_SHA}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
