name: Build mcp-searxng

on:
  push:
    branches: [main]
    paths:
      - 'mcp-searxng/**'
      - '.github/workflows/build-mcp-searxng.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-searxng/**'
      - '.github/workflows/build-mcp-searxng.yaml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dean-amer-dev/mcp-searxng

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx (in-pod BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: unix:///run/buildkit/buildkitd.sock
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-searxng
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
      - name: Record digest
        if: github.event_name != 'pull_request'
        run: echo "${IMAGE}:sha-${GITHUB_SHA}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
