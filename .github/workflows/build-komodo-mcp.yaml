name: Build komodo-mcp

on:
  push:
    branches: [main]
    paths:
      - 'komodo-mcp/**'
      - '.github/workflows/build-komodo-mcp.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'komodo-mcp/**'
      - '.github/workflows/build-komodo-mcp.yaml'
  workflow_dispatch:

env:
  IMAGE: amerenda/komodo-mcp
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  set-tag:
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-dean-mcp
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: arc-runner-dean-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --no-cache-dir -e ./komodo-mcp pytest
      - name: Import sanity check
        run: python -c "import komodo_mcp.server"
      - name: Run tests (if any exist)
        run: |
          if [ -d komodo-mcp/tests ]; then pytest komodo-mcp/tests -v; else echo "no tests/ dir yet — skipping"; fi

  build:
    needs: [set-tag, test]
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-dean-mcp
    outputs:
      tag: ${{ needs.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./komodo-mcp
          file: ./komodo-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.set-tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=komodo-mcp
          cache-to: type=gha,mode=max,scope=komodo-mcp
      - name: Notify MCP factory
        continue-on-error: true  # don't fail the build if PRAETOR_API_KEY isn't wired up yet
        env:
          PRAETOR_API_KEY: ${{ secrets.PRAETOR_API_KEY }}
        run: |
          curl -sf -X POST https://praetor.amer.dev/api/v1/mcp/register-from-ci \
            -H "Authorization: Bearer ${PRAETOR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json; d=json.load(open("komodo-mcp/mcp.json")); d["name"]="komodo-mcp"; d["image"]="${{ env.IMAGE }}:latest"; print(json.dumps(d))')"

  deploy:
    needs: [build]
    if: |
      always() &&
      needs.build.result == 'success'
    runs-on: arc-runner-dean-mcp
    steps:
      - uses: actions/checkout@v4
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CODER_APP_ID }}
          private-key: ${{ secrets.CODER_APP_PRIVATE_KEY }}
          repositories: k3s-dean-gitops
      - name: Create deploy PR
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone https://x-access-token:${GH_TOKEN}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          APP_NAME="komodo-mcp"

          EXISTING_PRS=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls?state=open&per_page=100" \
            | python3 -c "
          import json,sys
          for pr in json.load(sys.stdin):
              ref = pr.get('head',{}).get('ref','')
              if ref.startswith('deploy/${APP_NAME}-'):
                  print(pr['number'])
          " 2>/dev/null || true)
          for PR_NUM in $EXISTING_PRS; do
            curl -sf -X PATCH \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITOPS_REPO}/pulls/${PR_NUM}" \
              -d '{"state":"closed"}' > /dev/null
          done

          BRANCH="deploy/${APP_NAME}-${TAG}"
          git checkout -b "${BRANCH}"

          sed -i "s|amerenda/${APP_NAME}:[^ ]*|amerenda/${APP_NAME}:${TAG}|g" \
            apps/mcp/komodo-mcp/deployment.yaml

          git config user.name "amerenda-coder[bot]"
          git config user.email "amerenda-coder[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${APP_NAME} ${TAG}"
          git push origin "${BRANCH}"

          COMMIT_MSG=$(git -C "${GITHUB_WORKSPACE}" log -1 --format='%s' 2>/dev/null || echo "")
          NL=$'\n'
          PR_BODY="**${APP_NAME} ${TAG}** (multi-arch: amd64+arm64)${NL}${NL}${COMMIT_MSG}${NL}${NL}Source: https://github.com/amerenda/dean-mcp/commit/${GITHUB_SHA}"

          curl -sf -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls" \
            -d "$(jq -n \
              --arg title "deploy: ${APP_NAME} ${TAG}" \
              --arg body "${PR_BODY}" \
              --arg head "${BRANCH}" \
              --arg base "main" \
              '{title: $title, body: $body, head: $head, base: $base}')"

  # "Notify MCP factory" registers this server's tool metadata with Praetor;
  # it does not control deployment. The "deploy" job above is what actually
  # rolls out new builds, bumping apps/mcp/komodo-mcp/deployment.yaml to the
  # new sha tag via a gated PR to k3s-dean-gitops (mirrors infra-mcp/bws-mcp).
