name: Build bws-mcp

on:
  push:
    branches: [main]
    paths:
      - 'bws-mcp/**'
  pull_request:
    branches: [main]
    paths:
      - 'bws-mcp/**'
  workflow_dispatch:

env:
  IMAGE: amerenda/bws-mcp
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  set-tag:
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-set
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      pr_prefix: ${{ steps.tag.outputs.pr_prefix }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "pr_prefix=deploy" >> "$GITHUB_OUTPUT"

  build-amd64:
    name: Build amd64
    needs: [set-tag]
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-set
    env:
      TAG: ${{ needs.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Build and push (amd64)
        run: |
          docker build -t "${IMAGE}:${TAG}-amd64" -f bws-mcp/Dockerfile bws-mcp/
          docker push "${IMAGE}:${TAG}-amd64"

  build-arm64:
    name: Build arm64
    needs: [set-tag]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, mac-mini]
    env:
      TAG: ${{ needs.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Build and push (arm64)
        run: |
          docker build -t "${IMAGE}:${TAG}-arm64" -f bws-mcp/Dockerfile bws-mcp/
          docker push "${IMAGE}:${TAG}-arm64"

  manifest:
    needs: [set-tag, build-amd64, build-arm64]
    if: |
      always() &&
      needs.build-amd64.result == 'success' &&
      needs.build-arm64.result == 'success'
    runs-on: arc-runner-set
    env:
      TAG: ${{ needs.set-tag.outputs.tag }}
    steps:
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools create -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

  deploy:
    needs: [set-tag, manifest]
    if: |
      always() &&
      needs.manifest.result == 'success'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Create deploy PR
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          PREFIX: ${{ needs.set-tag.outputs.pr_prefix }}
        run: |
          rm -rf /tmp/gitops
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          APP_NAME="bws-mcp"

          EXISTING_PRS=$(curl -s \
            -H "Authorization: token ${GITOPS_PAT}" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls?state=open&per_page=100" \
            | python3 -c "
          import json,sys
          for pr in json.load(sys.stdin):
              ref = pr.get('head',{}).get('ref','')
              if ref.startswith('deploy/${APP_NAME}-') or ref.startswith('release/${APP_NAME}-'):
                  print(pr['number'])
          " 2>/dev/null || true)
          for PR_NUM in $EXISTING_PRS; do
            curl -s -X PATCH \
              -H "Authorization: token ${GITOPS_PAT}" \
              "https://api.github.com/repos/${GITOPS_REPO}/pulls/${PR_NUM}" \
              -d '{"state":"closed"}' > /dev/null
          done

          BRANCH="${PREFIX}/${APP_NAME}-${TAG}"
          git checkout -b "${BRANCH}"

          sed -i "s|amerenda/${APP_NAME}:[^ ]*|amerenda/${APP_NAME}:${TAG}|g" \
            apps/${APP_NAME}/server/deployment.yaml

          git config user.name "amerenda-deploy-bot[bot]"
          git config user.email "3192609+amerenda-deploy-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "${PREFIX}: ${APP_NAME} ${TAG}"
          git push origin "${BRANCH}"

          COMMIT_MSG=$(git -C "${GITHUB_WORKSPACE}" log -1 --format='%s' 2>/dev/null || echo "")
          NL=$'\n'
          PR_BODY="**${APP_NAME} ${TAG}**${NL}${NL}${COMMIT_MSG}${NL}${NL}Source: https://github.com/amerenda/dean-mcp/commit/${GITHUB_SHA}"

          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GITOPS_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls" \
            -d "$(jq -n \
              --arg title "${PREFIX}: ${APP_NAME} ${TAG}" \
              --arg body "${PR_BODY}" \
              --arg head "${BRANCH}" \
              --arg base "main" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          PR_NUMBER=$(echo "$PR_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['number'])")
          curl -s -X POST \
            -H "Authorization: token ${GITOPS_PAT}" \
            "https://api.github.com/repos/${GITOPS_REPO}/issues/${PR_NUMBER}/labels" \
            -d '["deploy:'"${APP_NAME}"'"]'
          curl -s -X POST \
            -H "Authorization: token ${GITOPS_PAT}" \
            "https://api.github.com/repos/${GITOPS_REPO}/issues/${PR_NUMBER}/assignees" \
            -d '{"assignees":["amerenda"]}'

  notify-failure:
    if: failure()
    needs: [build-amd64, build-arm64, manifest, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue for build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI failed: ${{ github.workflow }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure" || echo "Could not create issue"
