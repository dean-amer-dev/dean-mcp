[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-mcp"
version = "0.1.0"
description = "Infrastructure MCP server — provisions stateless and stateful services"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
infra-mcp = "infra_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_mcp"]
