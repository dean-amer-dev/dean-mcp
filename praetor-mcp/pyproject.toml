[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praetor-mcp"
version = "0.1.0"
description = "MCP server for dispatching Praetor agents from any MCP-aware client"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
praetor-mcp = "praetor_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/praetor_mcp"]
