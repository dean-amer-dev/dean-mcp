[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-mcp"
version = "0.1.0"
description = "GitHub repo browsing MCP server for planning sessions"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42",
]

[project.scripts]
github-mcp = "github_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/github_mcp"]
